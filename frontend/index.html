<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Request monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<h2>API Request monitor</h2>

<div id="analytics" class="analytics" ></div>

<div class="container">
 <div class="left">
    <div class="stats" id="stats">Loading...</div>
        <table>
            <thead>
                <tr>
                <th>Time</th>
                <th>Method</th>
                <th>Path</th>
                <th>Status</th>
                <th>Latency</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
 <div class="right">
   <div class="details-wrap">
    <button class="close-btn" onclick="closeDetails()">x</button>
    <div id="details">Click request for more info...</div>
   </div>
 </div>
</div>

<script src="script.js"></script>

</body>
</html>
